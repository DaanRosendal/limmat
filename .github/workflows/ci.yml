name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:style
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npm run check:package
      - run: npm run check:support
      - run: npm run size
      - run: npm pack --dry-run # the file list of a real publish (npm publish --dry-run fails once the version is on the registry)
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Docs-only changes cannot affect the browser tests, so the steps below are skipped for them. Anything that is not
      # listed here (including docs/support.json, which the demo reads) runs the tests, and so does any diff that fails.
      - name: Skip the browser tests for docs-only changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          files=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null) || files=""
          code=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(README|CHANGELOG|SECURITY|AGENTS|CLAUDE)\.md$|^docs/[^/]+\.(md|png|gif|mp4|webm)$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "browser tests needed: $code"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.changes.outputs.code == 'true'
      # The Azure Ubuntu mirror sometimes serves 50 kB/s for minutes, and apt never switches to another mirror by itself
      # (actions/runner-images#14823). So the first attempt is capped at 2 minutes, and the second attempt drops the Azure and
      # EC2 mirrors from the runner's mirror list (leaving archive.ubuntu.com) after stopping the first attempt's apt-get,
      # which would otherwise keep the dpkg lock.
      - name: Make apt retry stalled downloads
        if: steps.changes.outputs.code == 'true'
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "300";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
      - name: Install the browser
        id: install
        if: steps.changes.outputs.code == 'true'
        run: timeout --kill-after=10 120 npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 3
        continue-on-error: true
      - name: Install the browser (second try)
        if: steps.changes.outputs.code == 'true' && steps.install.outcome != 'success'
        run: |
          sudo pkill -x apt-get || true
          sudo pkill -x dpkg || true
          sudo dpkg --configure -a || true
          echo "apt mirrors before:"; cat /etc/apt/apt-mirrors.txt || true
          grep -vE 'azure\.archive\.ubuntu\.com|ec2\.archive\.ubuntu\.com' /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/mirrors" || true
          [ -s "$RUNNER_TEMP/mirrors" ] || echo 'http://archive.ubuntu.com/ubuntu/' > "$RUNNER_TEMP/mirrors"
          sudo cp "$RUNNER_TEMP/mirrors" /etc/apt/apt-mirrors.txt
          echo "apt mirrors after:"; cat /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 5
      - run: npm run build
        if: steps.changes.outputs.code == 'true'
      - run: npm run build:demo
        if: steps.changes.outputs.code == 'true'
      - run: npx playwright test --project=${{ matrix.browser }} --workers=${{ matrix.browser == 'chromium' && 1 || 2 }}
        if: steps.changes.outputs.code == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
