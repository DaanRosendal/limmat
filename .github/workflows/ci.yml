name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:style
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npm run check:package
      - run: npm run check:support
      - run: npm run size
      - run: npm publish --dry-run # the same hooks and file list as a real publish, without publishing
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Docs-only changes cannot affect the browser tests, so the steps below are skipped for them. Anything that is not
      # listed here (including docs/support.json, which the demo reads) runs the tests, and so does any diff that fails.
      - name: Skip the browser tests for docs-only changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          files=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null) || files=""
          code=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(README|CHANGELOG|SECURITY|AGENTS|CLAUDE)\.md$|^docs/[^/]+\.(md|png|gif|mp4|webm)$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "browser tests needed: $code"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changes.outputs.code == 'true'
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.changes.outputs.code == 'true'
      # The Ubuntu mirror can stall for minutes, so apt retries and gives up on a silent connection.
      - name: Make apt retry stalled downloads
        if: steps.changes.outputs.code == 'true'
        run: printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
      - name: Install the browser
        id: install
        if: steps.changes.outputs.code == 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 4
        continue-on-error: true
      - name: Install the browser (second try)
        if: steps.changes.outputs.code == 'true' && steps.install.outcome != 'success'
        run: npx playwright install --with-deps ${{ matrix.browser }}
        timeout-minutes: 6
      - run: npm run build
        if: steps.changes.outputs.code == 'true'
      - run: npm run build:demo
        if: steps.changes.outputs.code == 'true'
      - run: npx playwright test --project=${{ matrix.browser }} --workers=${{ matrix.browser == 'chromium' && 1 || 2 }}
        if: steps.changes.outputs.code == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
